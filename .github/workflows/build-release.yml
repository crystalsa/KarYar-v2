name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/**.md'
      - 'RELEASE_CHECKLIST.md'
      - 'LICENSE'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'ایجاد ریلیز در گیت‌هاب (Create GitHub Release)'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'تگ نسخه اختیاری (در صورت خالی بودن، نسخه به طور خودکار افزایش می‌یابد)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: |
          sed -i -e 's/\r$//' gradlew || true
          chmod +x gradlew

      - name: Restore Debug Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          chmod +x .github/scripts/restore-debug-keystore.sh
          .github/scripts/restore-debug-keystore.sh test

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-configuration-cache --stacktrace

  build:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: |
          sed -i -e 's/\r$//' gradlew || true
          chmod +x gradlew

      - name: Prepare Keystore & Signing Environment
        id: prep_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Check if persistent debug keystore source exists before running restore script
          HAS_PERSISTENT_DEBUG="false"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ] || [ -s "debug.keystore.base64" ]; then
            HAS_PERSISTENT_DEBUG="true"
          fi

          chmod +x .github/scripts/restore-debug-keystore.sh
          .github/scripts/restore-debug-keystore.sh build

          # 1. Primary: Check custom release signing secrets
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore" 2>/dev/null || echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            if [ ! -s "$GITHUB_WORKSPACE/release.keystore" ]; then
              echo "::error::KEYSTORE_BASE64 is provided but base64 decoding failed or produced an empty file!"
              exit 1
            fi
            cp "$GITHUB_WORKSPACE/release.keystore" "$GITHUB_WORKSPACE/my-upload-key.jks" 2>/dev/null || true
            echo "has_release_keystore=true" >> $GITHUB_OUTPUT
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=${KEY_ALIAS:-upload}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          # 2. Fallback: Use persistent repository keystore (debug.keystore.base64 / DEBUG_KEYSTORE_BASE64)
          elif [ "$HAS_PERSISTENT_DEBUG" = "true" ] && [ -s "$GITHUB_WORKSPACE/debug.keystore" ]; then
            echo "Using persistent repository keystore (debug.keystore.base64) for Release signing & GitHub Release..."
            cp "$GITHUB_WORKSPACE/debug.keystore" "$GITHUB_WORKSPACE/release.keystore"
            cp "$GITHUB_WORKSPACE/debug.keystore" "$GITHUB_WORKSPACE/my-upload-key.jks" 2>/dev/null || true
            echo "has_release_keystore=true" >> $GITHUB_OUTPUT
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          else
            echo "has_release_keystore=false" >> $GITHUB_OUTPUT
            echo "::warning title=کلید رسمی انتشار یافت نشد::هیچ کلید ثابتی یافت نشد. APK با کلید موقت بیلد می‌شود و ریلیز عمومی در گیت‌هاب ایجاد نخواهد شد."
          fi

      - name: Determine Version Info (Auto-Increment)
        id: version_info
        run: |
          git fetch --tags --force 2>/dev/null || true

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Manually pushed release tag
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG#v}"
            IS_RELEASE="true"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            # Manual workflow dispatch with specific tag
            TAG="${{ inputs.release_tag }}"
            VERSION_NAME="${TAG#v}"
            IS_RELEASE="true"
          else
            # Push to main/master: Auto-increment patch version based on latest existing tag
            LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
            if [ -z "$LATEST_TAG" ]; then
              VERSION_NAME="1.0.1"
            else
              RAW_VER="${LATEST_TAG#v}"
              MAJOR=$(echo "$RAW_VER" | cut -d. -f1)
              MINOR=$(echo "$RAW_VER" | cut -d. -f2)
              PATCH=$(echo "$RAW_VER" | cut -d. -f3)
              MAJOR=${MAJOR:-1}
              MINOR=${MINOR:-0}
              PATCH=${PATCH:-0}
              NEW_PATCH=$((PATCH + 1))
              VERSION_NAME="${MAJOR}.${MINOR}.${NEW_PATCH}"
            fi
            TAG="v${VERSION_NAME}"
            IS_RELEASE="true"
            echo "Auto-incremented release version: $TAG (previous: ${LATEST_TAG:-none})"
          fi

          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 1)
          if [ -z "$COMMIT_COUNT" ] || [ "$COMMIT_COUNT" -le 0 ]; then
            COMMIT_COUNT=1
          fi

          echo "VERSION_CODE=$COMMIT_COUNT" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT

      - name: Build APK (Release or Debug)
        run: |
          mkdir -p artifacts
          if [ "${{ steps.prep_signing.outputs.has_release_keystore }}" == "true" ]; then
            echo "Building signed Release APK with versionCode=$VERSION_CODE, versionName=$VERSION_NAME..."
            ./gradlew assembleRelease -PVERSION_CODE=$VERSION_CODE -PVERSION_NAME=$VERSION_NAME --no-configuration-cache --stacktrace
            APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          else
            echo "Building Debug APK with versionCode=$VERSION_CODE, versionName=$VERSION_NAME..."
            ./gradlew assembleDebug -PVERSION_CODE=$VERSION_CODE -PVERSION_NAME=$VERSION_NAME --no-configuration-cache --stacktrace
            APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "artifacts/KarYar-${{ steps.version_info.outputs.tag }}.apk"
            cp "$APK_FILE" artifacts/KarYar-Latest.apk
            cp "$APK_FILE" artifacts/WorkerManager-App.apk
            echo "Generated APK artifacts:"
            ls -lh artifacts/
          else
            echo "::error::No APK file found after build!"
            exit 1
          fi

      - name: Verify APK Version Info
        run: |
          echo "Verifying version metadata in generated APK..."
          APK_FILE=$(find artifacts -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK found in artifacts directory!"
            exit 1
          fi

          AAPT2_BIN=$(find $ANDROID_HOME/build-tools -name aapt2 2>/dev/null | sort -V | tail -n 1)
          APK_VNAME=""
          APK_VCODE=""
          if [ -n "$AAPT2_BIN" ] && [ -x "$AAPT2_BIN" ]; then
            echo "Using AAPT2 at: $AAPT2_BIN"
            $AAPT2_BIN dump badging "$APK_FILE" | grep -E "package: name=" || true
            APK_VNAME=$($AAPT2_BIN dump badging "$APK_FILE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
            APK_VCODE=$($AAPT2_BIN dump badging "$APK_FILE" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          fi

          if [ -z "$APK_VNAME" ]; then
            APK_ANALYZER=$(find $ANDROID_HOME/cmdline-tools -name apkanalyzer 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$APK_ANALYZER" ] && [ -x "$APK_ANALYZER" ]; then
              echo "Using APKAnalyzer at: $APK_ANALYZER"
              APK_VNAME=$($APK_ANALYZER manifest version-name "$APK_FILE" 2>/dev/null || true)
              APK_VCODE=$($APK_ANALYZER manifest version-code "$APK_FILE" 2>/dev/null || true)
            fi
          fi

          echo "APK internal versionCode: $APK_VCODE (Expected: $VERSION_CODE)"
          echo "APK internal versionName: $APK_VNAME (Expected: $VERSION_NAME)"

          if [ "${{ steps.version_info.outputs.is_release }}" == "true" ] && [ -n "${{ steps.version_info.outputs.tag }}" ]; then
            EXPECTED_TAG_VNAME="${{ steps.version_info.outputs.version_name }}"
            if [ "$APK_VNAME" != "$EXPECTED_TAG_VNAME" ]; then
              echo "::error::Version mismatch! APK contains versionName='$APK_VNAME' but release tag expects '$EXPECTED_TAG_VNAME'!"
              exit 1
            fi
            echo "Verification PASSED: APK internal version perfectly matches tag ($EXPECTED_TAG_VNAME)."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KarYar-APK
          path: artifacts/KarYar-Latest.apk
          retention-days: 30

      - name: Notify No Public Release Due to Missing Keystore
        if: steps.prep_signing.outputs.has_release_keystore != 'true'
        run: |
          echo "=========================================================================================="
          echo "⚠️ هشدار: متغیر KEYSTORE_BASE64 در GitHub Secrets تنظیم نشده است."
          echo "به منظور حفظ یکپارچگی داده‌های کاربران و جلوگیری از خطای نصب نسخه جدید روی نسخه قبلی (تغییر امضا)،"
          echo "هیچ ریلیز عمومی در گیت‌هاب ایجاد نمی‌شود. فایل APK صرفاً در بخش Artifacts آپلود شد."
          echo "=========================================================================================="

      - name: Create GitHub Release
        if: steps.prep_signing.outputs.has_release_keystore == 'true' && steps.version_info.outputs.is_release == 'true' && steps.version_info.outputs.tag != '' && (github.event_name != 'workflow_dispatch' || inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: نسخه ${{ steps.version_info.outputs.tag }} - برنامه کاریار KarYar
          body: |
            ### 📱 فایل نصبی رسمی اندروید (KarYar APK)
            - **نسخه (Version Name):** `${{ steps.version_info.outputs.version_name }}`
            - **کد نسخه (Version Code):** `${{ steps.version_info.outputs.version_code }}`
            - **وضعیت امضا:** امضاشده با کلید اختصاصی انتشار (Release Keystore)
            
            📥 جهت دانلود و نصب روی گوشی اندروید، فایل `KarYar-${{ steps.version_info.outputs.tag }}.apk` را از بخش Assets در زیر دانلود نمایید.
          files: |
            artifacts/KarYar-${{ steps.version_info.outputs.tag }}.apk
            artifacts/KarYar-Latest.apk
            artifacts/WorkerManager-App.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune Old Releases (Keep only latest 5, preserving git tags)
        if: steps.prep_signing.outputs.has_release_keystore == 'true' && steps.version_info.outputs.is_release == 'true'
        run: |
          echo "Checking existing releases to keep only the 5 most recent versions..."
          # gh release list returns releases ordered newest first.
          # We use jq to extract all releases from index 5 onward (i.e. older than top 5).
          OLD_RELEASES=$(gh release list --limit 100 --json tagName --jq '.[5:][].tagName' 2>/dev/null || true)
          if [ -n "$OLD_RELEASES" ]; then
            echo "Found older releases to prune (keeping latest 5):"
            echo "$OLD_RELEASES"
            for old_tag in $OLD_RELEASES; do
              echo "Pruning old release (preserving git tag): $old_tag"
              gh release delete "$old_tag" --yes 2>/dev/null || echo "Could not delete release $old_tag"
            done
            echo "Successfully pruned older releases. Git tags are preserved and the 5 latest releases are kept."
          else
            echo "Total releases count is 5 or fewer. No pruning needed."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
